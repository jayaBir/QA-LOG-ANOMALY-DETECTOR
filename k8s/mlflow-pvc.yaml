apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: qa-log-anomaly-detector
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: qa-log-anomaly-detector
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Use the cluster default StorageClass. Set storageClassName explicitly only
  # when your EKS, Minikube, or k3s cluster requires a non-default class.
